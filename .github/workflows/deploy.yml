name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-omnisecure
  cancel-in-progress: true

jobs:
  deploy-api:
    name: Fly.io API
    runs-on: ubuntu-latest
    if: github.repository == 'subtiliorars-sys/OmniSecure'
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy API
        run: flyctl deploy --config fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-vault:
    name: Cloudflare Pages (vault)
    runs-on: ubuntu-latest
    needs: deploy-api
    if: github.repository == 'subtiliorars-sys/OmniSecure'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - name: Build vault web
        run: pnpm build:vault
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://omnisecure-api.fly.dev' }}
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/vault-web/dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'omnisecure-vault' }}
