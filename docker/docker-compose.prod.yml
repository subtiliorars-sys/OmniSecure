services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - "8787:8787"
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      OMNISECURE_DB: /data/omnisecure.db
      OMNISECURE_PUBLIC_URL: ${OMNISECURE_PUBLIC_URL:-http://localhost:8080}
      OMNISECURE_API_URL: ${OMNISECURE_API_URL:-http://localhost:8787}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost:8080}
      WEBAUTHN_RP_NAME: OmniSecure
      PORT: "8787"
      HOST: "0.0.0.0"
    volumes:
      - omnisecure-data:/data
      - attachment-data:/attachments
    restart: unless-stopped

  vault-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        VITE_API_URL: ${OMNISECURE_API_URL:-http://localhost:8787}
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: omnisecure
      POSTGRES_USER: omnisecure
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    profiles:
      - postgres
    restart: unless-stopped

volumes:
  omnisecure-data:
  attachment-data:
  postgres-data:
