services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - "8787:8787"
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      OMNISECURE_DB: /data/omnisecure.db
      PORT: "8787"
      HOST: "0.0.0.0"
    volumes:
      - omnisecure-data:/data
    restart: unless-stopped

  vault-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  omnisecure-data:
