app = "omnisecure-api"
primary_region = "iad"

[build]
  dockerfile = "docker/Dockerfile.api"

[env]
  PORT = "8787"
  HOST = "0.0.0.0"
  OMNISECURE_DB = "/data/omnisecure.db"
  NODE_ENV = "production"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[mounts]]
  source = "omnisecure_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
