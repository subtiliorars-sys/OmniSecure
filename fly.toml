app = "omnisecure-api"
primary_region = "iad"

[build]
  dockerfile = "docker/Dockerfile.api"

[env]
  PORT = "8787"
  HOST = "0.0.0.0"
  OMNISECURE_DB = "/data/omnisecure.db"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "omnisecure_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
